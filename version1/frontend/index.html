<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GastroNode</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    </head>
    <body>
        <div class="login-container">
            <div class="login-box">
                <div class="login-box-header">
                    <i class="fa-solid fa-utensils fa-5x fork"></i>
                    <h1>Bienvenido a GastroNode</h1>
                    <p>Sistema Integral de Gestión</p>
                </div>
                <div class="login-box-body">
                    <form action="" class="login-form">
                        <label for="username" class="login-form">
                            <i class="fa-solid fa-user"></i> Usuario</label
                        >
                        <br />
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingrese su usuario"
                        />
                        <label for="userpassword" class="login-form">
                            <i class="fa-solid fa-lock"></i> Contraseña</label
                        >
                        <div class="pass">
                            <input
                                type="password"
                                id="userpassword"
                                name="userpassword"
                                placeholder="Ingrese su contrasena"
                            />
                            <i class="fa-solid fa-eye"></i>
                        </div>
                        <div class="userpref">
                            <div>
                                <input
                                    type="checkbox"
                                    id="user"
                                    name="user"
                                    class="prefs"
                                />
                                <label for="user">Recordar sesión</label>
                            </div>
                            <div>
                                <p class="">
                                    <a href="">Olvidaste tu contraseña?</a>
                                </p>
                            </div>
                        </div>
                        <br />
                        <button type="button" class="sesionbtn">
                            <i class="fa-solid fa-right-to-bracket"></i> Iniciar
                            Sesión
                        </button>
                    </form>
                </div>
                <hr />
                <div class="login-box-footer">
                    <p>Versión 1.0.0 - Sistema de Gestión de Restaurantes</p>
                </div>
            </div>
        </div>
    </body>
</html>
